<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Регистрация</title>
</head>
<body>
    <header>
        <a href="../index.html" class="logo">Game<span>Center</span></a>
        <nav>
            <ul>
                <li><a href="../index.html">Главная</a></li>
                <li><a href="../pages/catalog.html">Каталог</a></li>
                <li><a href="../pages/login.html">Войти</a></li>
                <li><a href="../pages/register.html">Регистрация</a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-main">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <form class="auth-form" id="register-form" novalidate>
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Ваше ФИО">
                    <span class="form-error" data-error-for="fullname"></span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="email" placeholder="Email">
                    <span class="form-error" data-error-for="email"></span>
                </div>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="login" name="login" placeholder="Логин">
                    <span class="form-error" data-error-for="login"></span>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Пароль">
                    <span class="form-error" data-error-for="password"></span>
                </div>
                <div class="form-group">
                    <label>Повтор пароля</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Повторите пароль">
                    <span class="form-error" data-error-for="confirm"></span>
                </div>
                <button type="submit" class="btn-submit">Зарегистрироваться</button>
            </form>
            <p class="auth-switch">
                Уже есть аккаунт? <a href="./login.html">Войти</a>
            </p>
        </div>
    </main>
    <script src="../scripts/register.js"></script>
</body>
</html>
