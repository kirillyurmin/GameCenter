<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Авторизация</title>
</head>
<body>
    <header>
        <a href="../index.html" class="logo">Game<span>Center</span></a>
        <nav>
            <ul>
                <li><a href="../index.html">Главная</a></li>
                <li><a href="../pages/catalog.html">Каталог</a></li>
                <li><a href="../pages/login.html">Войти</a></li>
                <li><a href="../pages/register.html">Регистрация</a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-main">
        <div class="auth-card">
            <h1>Авторизация</h1>
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label>Логин</label>
                    <input  type="text" id="login" name="login" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn-submit">Войти</button>
            </form>
            <p class="auth-switch">
                Нет аккаунта? <a href="./register.html">Зарегистрироваться</a>
            </p>
        </div>
    </main>
</body>
</html>
